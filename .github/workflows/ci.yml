name: CI

# Temporarily disabled — not running on push/PR.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start PostgreSQL
        run: |
          docker run -d --name pos-test-pg \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=pos_test \
            -p 5432:5432 \
            postgres:16
          for i in $(seq 1 30); do
            docker exec pos-test-pg pg_isready -U postgres && break
            sleep 1
          done

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate and test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test?schema=public
          JWT_SECRET: ci-jwt-secret-min-32-characters-ok
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-ok
        run: |
          npx prisma migrate deploy
          npm run test

      - name: Build
        run: npm run build
